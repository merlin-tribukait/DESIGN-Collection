<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#08080c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#8f96a3"/>
      <stop offset="100%" stop-color="#2a2d36"/>
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff2d55"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Glow -->
  <rect width="800" height="800" fill="none"/>
  <circle cx="400" cy="400" r="350" fill="url(#bg-glow)"/>

  <!-- Outer Armored Shield -->
  <polygon points="400,90 650,180 620,530 400,710 180,530 150,180" 
           fill="none" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
           
  <!-- Neon Energy Channel -->
  <polygon points="400,125 615,205 590,505 400,665 210,505 185,205" 
           fill="none" stroke="#000000" stroke-width="4" filter="url(#glow-filter)"/>

  <!-- Inner Carbon Chassis -->
  <polygon points="400,150 580,225 560,480 400,620 240,480 220,225" 
           fill="#0c0d14" stroke="#252733" stroke-width="3"/>

  <!-- Center Core Monogram / Emblem -->
  
  <!-- MT Centerpiece -->
  <g transform="translate(230, 240) scale(1.7)" filter="url(#glow-filter)">
    <path d="M 20,160 L 20,40 L 60,40 L 100,110 L 140,40 L 180,40 L 180,160 L 150,160 L 150,90 L 115,150 L 85,150 L 50,90 L 50,160 Z" fill="url(#shield-rim)" stroke="{accent_primary}" stroke-width="2"/>
    <path d="M 70,40 L 130,40 L 130,65 L 110,65 L 110,160 L 90,160 L 90,65 L 70,65 Z" fill="#000000" opacity="0.9"/>
  </g>
  

  <!-- Bottom Brand Text -->
  <text x="400" y="745" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="4">MERLIN TRIBUKAIT</text>
  <text x="400" y="775" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f0ff" letter-spacing="3">SYSTEMS ARCHITECT & GAME CORE ENGINEER</text>
</svg>